name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  php:
    name: PHP tests + lint + analysis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          # No MARIADB_DATABASE: install-wp-tests.sh creates the DB itself and
          # prompts interactively (breaking CI) if it already exists.
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress test library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion mariadb-client
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress

      - name: PHPUnit
        run: ./vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      - name: PHPCS (zero findings expected)
        run: ./vendor/bin/phpcs

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  js:
    name: JS tests + build drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (matches dev server)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Vitest
        run: npx vitest run

      # The committed calculator.js and every .min file must be exactly what
      # the build produces from the module sources. Stale committed assets
      # have shipped before (CHANGELOG 2.23.0); this step makes it impossible
      # to merge that state again.
      - name: Rebuild assets and fail on drift
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bash build-min.sh
          git diff --exit-code -- public/ || {
            echo "::error::Committed assets differ from a fresh build. Run bash build-min.sh and commit the result."
            exit 1
          }

      - name: ESLint (zero errors enforced)
        run: npx eslint .

  package:
    name: Release package builds
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS dependencies
        run: npm ci
      - name: Build the release zip (current version, no bump)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          CURRENT=$(grep "define.*ADC_VERSION" ambrosia-dosage-calculator.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
          bash build-zip.sh "$CURRENT"
      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/*.zip
          retention-days: 14
